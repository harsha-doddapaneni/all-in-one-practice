- name: installing packages
  hosts: web
  become: yes
  tasks:
  - name: installing multiple packages
    ansible.builtin.package:
      name: "{{ item }}"
      state: present
    loop:
    - mysql
    - nginx
    - postfix
    - httpd

  - name: runnig multiple packages
    ansible.builtin.service:
      name: "{{ item }}"
      state: started
      enabled: yes
    loop:
    - nginx
    - postfix