- name: installing packages
  hosts: web
  become: yes
  tasks:
  - name: installing multiple packages
    ansible.builtin.package:
      name: "{{ item }}"
      state: present
    ansible.builtin.service:
      name: "{{ item }}"
      state: started
    loop:
    - mysql
    - nginx
    - postfix
    - httpd

